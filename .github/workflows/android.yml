# Builds the signed Android TV APK and publishes it in Releases.
# Stable link: https://github.com/<owner>/<repo>/releases/latest/download/manara.apk
# Signing: android/signing/manara-release.p12.enc, unlocked with the SIGNING_PASSPHRASE secret,
# only in the signing step (the build itself never sees the key).
name: Android TV app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: true

env:
  APP_VERSION: '1.3.0'
  BUILD_NUMBER: ${{ github.run_number }}
  CERT_SHA256: '82:34:EF:40:38:6C:05:F5:3E:7B:F5:4E:82:1B:09:55:72:41:ED:5C:42:A1:6C:F8:69:49:72:98:59:50:7E:94'

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # to publish the release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Put the screen page into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp docs/index.html android/app/src/main/assets/index.html
          ls -la android/app/src/main/assets/

      - name: Build the APK (unsigned)
        working-directory: android
        run: |
          export VERSION_CODE=$BUILD_NUMBER
          chmod +x gradlew
          if ! ./gradlew --no-daemon assembleRelease > "$RUNNER_TEMP/build.log" 2>&1; then
            grep -E "error:|e: |What went wrong|FAILURE|\.java:[0-9]+" "$RUNNER_TEMP/build.log" | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            tail -80 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          ls -la app/build/outputs/apk/release/

      - name: Sign the APK
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          if [ -z "$SIGNING_PASSPHRASE" ]; then
            echo "::error::Add the SIGNING_PASSPHRASE secret (Settings > Secrets and variables > Actions) to sign the app."
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          KS="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$KS"' EXIT
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 \
            -in android/signing/manara-release.p12.enc -out "$KS" -pass env:SIGNING_PASSPHRASE
          mkdir -p out
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-type PKCS12 --ks-key-alias manara \
            --ks-pass env:SIGNING_PASSPHRASE --key-pass env:SIGNING_PASSPHRASE \
            --out out/manara.apk "$RUNNER_TEMP/aligned.apk"

      - name: Check the APK
        run: |
          APK=out/manara.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee verify.txt
          WANT=$(echo "$CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')
          grep -qi "SHA-256 digest: $WANT" verify.txt || { echo "::error::APK is not signed with the app's key"; exit 1; }
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion|^application-label|^leanback-launchable-activity" badging.txt | cut -c1-300
          grep -q "^leanback-launchable-activity" badging.txt || { echo "::error::The app would not show in the TV launcher"; exit 1; }
          "$BT/aapt2" dump permissions "$APK" | tee perms.txt
          # Only these permissions are expected: internet (phone control), start on boot, and the overlay right for starting on boot.
          EXTRA=$(grep -o "name='[^']*'" perms.txt | sed "s/name='//;s/'//" | grep -v -x -e android.permission.INTERNET -e android.permission.RECEIVE_BOOT_COMPLETED -e android.permission.SYSTEM_ALERT_WINDOW -e 'com.m3athrazaq.manara.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION' || true)
          if [ -n "$EXTRA" ]; then echo "::error::Unexpected permissions: $EXTRA"; exit 1; fi
          if "$BT/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -q 'android:debuggable.*0xffffffff'; then echo "::error::Release APK must not be debuggable"; exit 1; fi
          unzip -l "$APK" | grep -E "assets/index.html$" || { echo "::error::The screen page is missing from the APK"; exit 1; }
          unzip -p "$APK" assets/index.html | grep -q "ManaraLink" || { echo "::error::The screen page in the APK is out of date"; exit 1; }
          ls -la "$APK"
          sha256sum "$APK" | tee out/sha256.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG="v$APP_VERSION-$BUILD_NUMBER"
          BASE="https://github.com/$REPO/releases/latest/download"
          printf '%s\n' \
            "شاشة المسجد — النسخة $APP_VERSION (بناء $BUILD_NUMBER)" "" \
            "- **أندرويد TV:** [manara.apk]($BASE/manara.apk) — على التلفزيون افتح الرابط في تطبيق Downloader، أو انسخ الملف على فلاش وثبّته من مدير الملفات." \
            "- التحديثات تُثبَّت فوق النسخة السابقة مع بقاء الإعدادات." \
            "" "SHA-256 للملف: \`$(cut -d' ' -f1 out/sha256.txt)\`" > notes.md
          set +e
          gh release create "$TAG" out/manara.apk --repo "$REPO" --target "$SHA" \
            --title "شاشة المسجد $APP_VERSION ($BUILD_NUMBER)" --notes-file notes.md --latest > release.log 2>&1
          rc=$?; cat release.log
          if [ $rc -ne 0 ]; then echo "::error::$(tr '\n' ' ' < release.log)"; exit 1; fi
